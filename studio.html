<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>STUDIO | 좀비잡초</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Archivo:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202608231410">
<link rel="stylesheet" href="css/board.css?v=202608231410">
<link rel="stylesheet" href="css/studio.css?v=202608231410">
</head>
<body class="board-page">

<header class="header scrolled" id="header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">🌱</span>
      <span class="logo-text">좀비잡초<em>STUDIO</em></span>
    </a>
    <nav class="nav" id="nav">
      <a href="board.html">BOARD</a>
      <a href="https://www.youtube.com/@jombijabcho" target="_blank" rel="noopener" class="nav-yt">YOUTUBE ↗</a>
      <a href="https://docs.google.com/spreadsheets/d/1IW65a8-4D4nkGQfbNSrVRZQYRV4128iRTYtK0d7FJi4/edit" target="_blank" rel="noopener" class="nav-sheet">📊 시트</a>
    </nav>
    <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
  </div>
</header>

<main class="studio" id="studio">
  <div class="board-head">
    <div>
      <p class="section-eyebrow">CONTENT STUDIO</p>
      <h1>🎬 콘텐츠 <span class="accent">스튜디오</span></h1>
      <p class="board-date" id="studioHint">아이디어는 마구 적고, 하나씩 채택해서 원고 → 촬영 → 편집 → 업로드로 옮기세요.</p>
    </div>
    <button class="btn btn-ghost btn-sm" id="refreshBtn">↻ 새로고침</button>
  </div>

  <!-- 아이디어 빠른 입력 -->
  <section class="quick-bar" id="quickBar">
    <div class="quick-row">
      <input id="ideaText" class="quick-input" type="text" placeholder="영상 아이디어 한 줄 — 적고 Enter (마구 적어도 됨)" autocomplete="off">
      <select id="ideaPrj" class="quick-sel" title="관련 프로젝트"></select>
      <button class="btn btn-primary btn-sm" id="ideaAdd">+ 아이디어</button>
    </div>
    <div class="quick-msg" id="qMsg" hidden></div>
  </section>

  <div class="board-loading" id="boardLoading">불러오는 중… 🎬</div>
  <div class="board-error" id="boardError" hidden>시트를 불러오지 못했습니다.</div>

  <!-- 칸반 -->
  <section class="kanban" id="kanban" hidden>
    <div class="kcol" data-stage="아이디어"><div class="kcol-head"><h2>💡 아이디어</h2><span class="kcount" id="c0">0</span></div><div class="kcards" id="k0"></div></div>
    <div class="kcol" data-stage="원고"><div class="kcol-head"><h2>📝 원고</h2><span class="kcount" id="c1">0</span></div><div class="kcards" id="k1"></div></div>
    <div class="kcol" data-stage="촬영"><div class="kcol-head"><h2>🎥 촬영</h2><span class="kcount" id="c2">0</span></div><div class="kcards" id="k2"></div></div>
    <div class="kcol" data-stage="편집"><div class="kcol-head"><h2>✂️ 편집</h2><span class="kcount" id="c3">0</span></div><div class="kcards" id="k3"></div></div>
    <div class="kcol done" data-stage="업로드완료"><div class="kcol-head"><h2>🚀 업로드</h2><span class="kcount" id="c4">0</span></div><div class="kcards" id="k4"></div></div>
  </section>

  <details class="board-details" id="holdDetails" hidden>
    <summary>🗃 보류함 <span class="sec-hint" id="holdHint"></span></summary>
    <div class="task-list" id="holdList"></div>
  </details>

  <p class="studio-foot">카드의 <b>→</b> 로 다음 단계, <b>←</b> 로 이전 단계. 원고·영상 링크는 카드에서 바로 붙여넣기. 데이터는 시트 '콘텐츠' 탭에 저장됩니다.</p>
</main>

<script src="js/projects.js?v=202608231410"></script>
<script src="js/sheet-data.js?v=202608231410"></script>
<script src="js/main.js?v=202608231410"></script>
<script src="js/studio.js?v=202608231410"></script>
</body>
</html>
